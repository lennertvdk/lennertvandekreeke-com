<body>
  <main>

    <div class="topbar">
      <a class="back" href="/">&larr; Lennert van de Kreeke</a>
      <nav class="lang" aria-label="Language"><span aria-current="true">EN</span><a href="/de/contact/" hreflang="de" lang="de">DE</a><a href="/nl/contact/" hreflang="nl" lang="nl">NL</a></nav>
      <button class="theme-toggle" type="button" data-to-dark="Switch to dark theme" data-to-light="Switch to light theme" aria-label="Switch to dark theme">
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10 2.5a7.5 7.5 0 0 1 0 15z" fill="currentColor"/></svg>

    <header class="page-head">
      <h1>Contact</h1>
      <p class="lede">The easiest way to reach me is this form. It goes straight to my inbox.</p>
    </header>

    <section class="solo">
      <div class="body">
        <form class="contact-form" action="https://formspree.io/f/mjykqqog" method="POST" data-sending="Sending…" data-success="Thanks, your message is on its way." data-error="Something went wrong. Please try again in a moment.">
          <input type="hidden" name="_subject" value="New message from lennertvandekreeke.com">
          <input type="hidden" name="language" value="en">
          <label class="hp" aria-hidden="true">Leave empty <input type="text" name="_gotcha" tabindex="-1" autocomplete="off"></label>
          <label>Name <input type="text" name="name" autocomplete="name" required></label>
          <label>Email <input type="email" name="email" autocomplete="email" required></label>
          <label>Message <textarea name="message" rows="6" required></textarea></label>
          <button class="button" type="submit">Send</button>
          <p class="form-status" role="status" aria-live="polite"></p>
        </form>
        <p class="elsewhere">Elsewhere: <a href="https://www.instagram.com/l_vd_k/">Instagram</a> &middot; <a href="https://www.linkedin.com/in/lennert-van-de-kreeke/">LinkedIn</a> &middot; <a href="https://orcid.org/0009-0000-3939-5247">ORCID</a></p>
      </div>
